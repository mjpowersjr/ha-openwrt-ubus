[project]
name = "ha-openwrt-ubus"
version = "0.1.0"
description = "Modern OpenWrt ubus Home Assistant integration"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "homeassistant",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "aiohttp",
    "aioresponses",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
